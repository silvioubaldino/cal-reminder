name: cal-reminder
options:
  bundleIdPrefix: com.silvioubaldino
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4

targets:
  cal-reminder:
    type: application
    platform: macOS
    sources:
      - path: cal-reminder
    dependencies:
      - package: Sparkle
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    info:
      path: cal-reminder/App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: cal-reminder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Silvio Ubaldino"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        GoogleOAuthClientID: $(GOOGLE_OAUTH_CLIENT_ID)
        GoogleOAuthClientSecret: $(GOOGLE_OAUTH_CLIENT_SECRET)
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUScheduledCheckInterval: 86400
        # Under the App Sandbox Sparkle's installer has to run out of process (AYD-010).
        # The service backing it ships inside Sparkle.framework and is opted into here;
        # the -spki/-spks mach-lookup exceptions in the entitlements are what let the app
        # reach it. The downloader service is deliberately left off — the app already holds
        # com.apple.security.network.client and downloads in process.
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silvioubaldino.cal-reminder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: cal-reminder/App/cal-reminder.entitlements
        GENERATE_INFOPLIST_FILE: false

  cal-reminderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: cal-reminderTests
    dependencies:
      - target: cal-reminder
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true

schemes:
  cal-reminder:
    build:
      targets:
        cal-reminder: all
        cal-reminderTests: [test]
    test:
      targets:
        - cal-reminderTests
    run:
      config: Debug
