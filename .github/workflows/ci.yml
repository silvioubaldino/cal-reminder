name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build, test & lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        # XcodeGen emits the current project format (objectVersion 77), so CI must
        # use an Xcode new enough to read it. Pick the newest installed Xcode rather
        # than pinning a patch version that image rotation may drop.
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Lint
        run: swiftlint lint --strict

      - name: Build
        run: |
          xcodebuild build \
            -scheme cal-reminder \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -scheme cal-reminder \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
